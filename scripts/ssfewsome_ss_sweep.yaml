program: /home2/c.zuppinger/VT9_SSFewSOME/SS-FewSOME_Disease_Severity_Knee_Osteoarthritis/ss_fewsome/main.py
project: SS-Fewsome-SmallImages
name: sweep1
method: bayes
metric:
  name: train_loss
  goal: minimize
# early_terminate:
#   type: hyperband
#   min_iter: 6
parameters:
  beta2:
    max: 0.9999
    min: 0.8
    distribution: uniform
  beta1:
    max: 0.9999
    min: 0.8
    distribution: uniform
  eps:
    values:
      - "1e-8"
      - "1e-6"
      - "1e-4"
    distribution: categorical
  lr:
    max: 0.01
    min: 5e-5
    distribution: uniform
  weight_decay:
      max: 0.2
      min: 0
      distribution: uniform
  epochs:
    max: 800
    min: 200
    distribution: int_uniform